<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntelliSurface BITRIX Admin v3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{font:16px Arial;background:#0b1220;color:#eef;padding:18px;margin:0}.wrap{max-width:1000px;margin:auto}.card{background:#142035;padding:18px;border-radius:16px;margin:14px 0;border:1px solid #263751}input,button,select{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #40516b;background:#0b1628;color:white}button{background:#2563eb;border:0;font-weight:bold;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.seat{padding:12px;background:#0b1628;border-radius:10px}small,.muted{color:#aabbd5}.map{display:grid;grid-template-columns:repeat(8,minmax(28px,1fr));gap:7px}.mapseat{aspect-ratio:1;border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;padding:3px;font-size:12px;margin:0}.available{background:#16a34a}.occupied{background:#dc2626}.stale{background:#eab308;color:#111}.offline{background:#64748b}.reserved{background:#7c3aed!important}.tag{display:inline-block;background:#7c3aed;padding:4px 8px;border-radius:6px;font-size:12px}.danger{background:#dc2626}.notice{background:#0b1628;padding:12px;border-radius:10px}@media(max-width:480px){.map{grid-template-columns:repeat(5,minmax(28px,1fr))}}
</style></head><body><main class="wrap"><h1>IntelliSurface BITRIX</h1><small>Admin Control Panel · v3</small>
<section class="card" id="login"><h2>Admin Login</h2><input id="sid" placeholder="Student ID Admin"><input id="pw" type="password" placeholder="Password"><button id="go">Login Admin</button><p id="msg">Login untuk akses panel.</p></section>
<section class="hidden" id="panel"><div class="card"><h2>Seat Management</h2><p id="identity"></p><button id="refresh">Refresh Seats + Reservations</button><select id="floorFilter"><option value="all">Semua Tingkat</option><option value="F1">Tingkat F1</option><option value="F2">Tingkat F2</option><option value="F3">Tingkat F3</option></select><div id="stats" class="grid"></div></div>
<div class="card"><h3>Interactive Floor Map</h3><div id="mapInfo" class="notice">Klik seat pada peta untuk melihat maklumat.</div><div id="mapEdit" class="grid hidden"><div><label>Seat ID</label><input id="selectedSeat" readonly></div><div><label>Status seat</label><select id="mapStatus"><option value="available">Available</option><option value="occupied">Occupied</option><option value="stale">Stale</option><option value="offline">Offline</option></select><small id="lockNote"></small></div><button id="mapUpdate">Update Status Seat</button><button id="release" class="danger hidden">Release Reservation</button></div>
<h3>FLOOR 1 (F1)</h3><div id="floorMapF1" class="map"></div><h3>FLOOR 2 (F2)</h3><div id="floorMapF2" class="map"></div><h3>FLOOR 3 (F3)</h3><div id="floorMapF3" class="map"></div></div>
<div class="card"><h3>Reservations Aktif</h3><div id="reservationList" class="grid"></div></div><div class="card"><h3>Seat Management List</h3><div id="seats" class="grid"></div><button id="out" class="danger">Logout</button><p id="statusMsg"></p></div></section></main>
<script>
const db=supabase.createClient('https://snkirhyrmokpqsisruxw.supabase.co','sb_publishable_bgfquPefqNsGB7KC2PtBjg_Vf1f0c8A');const $=id=>document.getElementById(id);let selected=null,seats=[],reservations=[],studentMap={};
const email=id=>id.trim().toUpperCase().replace(/\s+/g,'')+'@student.aiu.edu.my';
$('go').onclick=async()=>{let {data,error}=await db.auth.signInWithPassword({email:email($('sid').value),password:$('pw').value});if(error){$('msg').textContent='Login gagal: '+error.message;return}let r=await db.from('user_roles').select('role').eq('user_id',data.user.id).maybeSingle();if(r.error||r.data?.role!=='admin'){await db.auth.signOut();$('msg').textContent='Akses ditolak: akaun bukan Admin.';return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('identity').textContent='Admin: '+data.user.email;await load()};
async function load(){let s=await db.from('seats').select('seat_id,status,reserved_by').order('seat_id');if(s.error){$('statusMsg').textContent=s.error.message;return}seats=s.data;
let r=await db.from('reservations').select('id,seat_id,student_id,status').eq('status','active');if(r.error){$('statusMsg').textContent=r.error.message;return}reservations=r.data||[];
// Resolve UUID to Student ID from Auth email via user_roles is not exposed to client; show UUID + lookup hint.
studentMap={};let f=$('floorFilter').value,rows=seats.filter(x=>f==='all'||x.seat_id.startsWith(f+'-')).sort((a,b)=>a.seat_id.localeCompare(b.seat_id,undefined,{numeric:true}));
let cnt={available:0,occupied:0,stale:0,offline:0,reserved:reservations.length};rows.forEach(x=>cnt[x.status]=(cnt[x.status]||0)+1);$('stats').innerHTML='';Object.entries(cnt).forEach(([k,v])=>{let d=document.createElement('div');d.className='seat';d.innerHTML='<b>'+k.toUpperCase()+'</b><h2>'+v+'</h2>'; $('stats').append(d)});
let rm=new Map(reservations.map(x=>[x.seat_id,x]));
['F1','F2','F3'].forEach(f=>{let el=$('floorMap'+f);el.innerHTML='';seats.filter(x=>x.seat_id.startsWith(f+'-')).sort((a,b)=>+a.seat_id.match(/S(\d+)/)[1]-+b.seat_id.match(/S(\d+)/)[1]).forEach(x=>{let res=rm.get(x.seat_id),b=document.createElement('button');b.className='mapseat '+(res?'reserved':x.status);b.textContent=x.seat_id.match(/S(\d+)/)[1];b.title=x.seat_id+' '+(res?'Reserved':' '+x.status);b.onclick=()=>selectSeat(x,res);el.append(b)})});
$('reservationList').innerHTML='';reservations.forEach(r=>{let d=document.createElement('div');d.className='seat';d.innerHTML='<b>'+r.seat_id+'</b><br><span class="tag">RESERVED</span><p>Student UUID: '+r.student_id+'</p>';let b=document.createElement('button');b.className='danger';b.textContent='Release Reservation';b.onclick=()=>releaseReservation(r);d.append(b);$('reservationList').append(d)});
$('seats').innerHTML='';rows.forEach(x=>{let r=rm.get(x.seat_id),d=document.createElement('div');d.className='seat';d.innerHTML='<b>'+x.seat_id+'</b> · '+(r?'RESERVED':x.status)+(r?'<p>Student UUID: '+r.student_id+'</p>':'');let b=document.createElement('button');b.textContent='View / Manage';b.onclick=()=>selectSeat(x,r);d.append(b);$('seats').append(d)})}
function selectSeat(s,r){selected={seat:s,res:r};$('selectedSeat').value=s.seat_id;$('mapStatus').value=s.status;$('mapEdit').classList.remove('hidden');$('release').classList.toggle('hidden',!r);$('mapUpdate').disabled=!!r;$('mapStatus').disabled=!!r;$('lockNote').textContent=r?'Seat dikunci kerana mempunyai Reservation aktif. Gunakan Release Reservation.':'';$('mapInfo').textContent=s.seat_id+' — '+(r?'RESERVED | Student UUID: '+r.student_id:'Status: '+s.status)}
$('mapUpdate').onclick=async()=>{if(!selected||selected.res)return;let {error}=await db.from('seats').update({status:$('mapStatus').value,reserved_by:null,updated_at:new Date().toISOString()}).eq('seat_id',selected.seat.seat_id);$('statusMsg').textContent=error?'Gagal: '+error.message:'Status seat dikemas kini.';if(!error)load()};
async function releaseReservation(r){if(!confirm('Release reservation untuk '+r.seat_id+'?'))return;let {error}=await db.from('reservations').update({status:'cancelled'}).eq('id',r.id).eq('status','active');$('statusMsg').textContent=error?'Release gagal: '+error.message:'Reservation dilepaskan.';if(!error)load()}
$('release').onclick=()=>selected?.res&&releaseReservation(selected.res);$('refresh').onclick=load;$('floorFilter').onchange=load;$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
</script></body></html>
