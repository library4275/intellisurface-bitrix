<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntelliSurface BITRIX Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{font:16px Arial;background:#0b1220;color:#eef;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#142035;padding:20px;border-radius:16px;margin:15px 0}input,button,select{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #40516b;background:#0b1628;color:white}button{background:#2563eb;border:0;font-weight:bold}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.seat{padding:12px;background:#0b1628;border-radius:10px}small{color:#aabbd5}.map{display:grid;grid-template-columns:repeat(8,minmax(28px,1fr));gap:8px}.mapseat{aspect-ratio:1;border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;padding:4px;font-size:12px}.available{background:#16a34a}.occupied{background:#dc2626}.stale{background:#eab308;color:#111}.offline{background:#64748b}@media(max-width:480px){.map{grid-template-columns:repeat(5,minmax(28px,1fr))}}
</style></head><body><main class="wrap"><h1>IntelliSurface BITRIX</h1><small>Admin Control Panel</small>
<section class="card" id="login"><h2>Admin Login</h2><input id="sid" placeholder="Student ID Admin"><input id="pw" type="password" placeholder="Password"><button id="go">Login Admin</button><p id="msg">Login untuk akses panel.</p></section>
<section class="card hidden" id="panel"><h2>Seat Management</h2><p id="identity"></p><button id="refresh">Refresh Seats</button><select id="floorFilter"><option value="all">Semua Tingkat</option><option value="F1">Tingkat F1</option><option value="F2">Tingkat F2</option><option value="F3">Tingkat F3</option></select><div id="stats" class="grid"></div><div class="card"><h3>Interactive Floor Map</h3><div id="mapInfo" class="seat">Klik seat pada peta untuk melihat maklumat.</div><div id="mapEdit" class="grid hidden"><div><label>Seat ID</label><input id="selectedSeat" readonly></div><div><label>Status</label><select id="mapStatus"><option value="available">Available</option><option value="occupied">Occupied</option><option value="stale">Stale</option><option value="offline">Offline</option></select></div><button id="mapUpdate" class="hidden">Update Status Seat</button><h3>FLOOR 1 (F1)</h3><div id="floorMapF1" class="map"></div><h3>FLOOR 2 (F2)</h3><div id="floorMapF2" class="map"></div><h3>FLOOR 3 (F3)</h3><div id="floorMapF3" class="map"></div></div><div id="seats" class="grid"></div><button id="out">Logout</button><p id="statusMsg"></p></section></main>
<script>
const db=supabase.createClient('https://snkirhyrmokpqsisruxw.supabase.co','sb_publishable_bgfquPefqNsGB7KC2PtBjg_Vf1f0c8A');
const $=x=>document.getElementById(x);let selectedMapSeat=null;
const email=id=>id.trim().toUpperCase().replace(/\\s+/g,'')+'@student.aiu.edu.my';
$('go').onclick=async()=>{ $('msg').textContent='Menyemak login...';let {data,error}=await db.auth.signInWithPassword({email:email($('sid').value),password:$('pw').value});if(error){$('msg').textContent='Login gagal: '+error.message;return}
let r=await db.from('user_roles').select('role').eq('user_id',data.user.id).maybeSingle();if(r.error||r.data?.role!=='admin'){await db.auth.signOut();$('msg').textContent='Akses ditolak: akaun bukan Admin.';return}
$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('identity').textContent='Admin: '+data.user.email;load();};
async function load(){let q=await db.from('seats').select('seat_id,status,reserved_by').order('seat_id');if(q.error){$('seats').textContent=q.error.message;return}
let floor=$('floorFilter').value;let rows=q.data.filter(s=>floor==='all'||s.seat_id.startsWith(floor+'-')).sort((a,b)=>{let fa=a.seat_id.split('-')[0],fb=b.seat_id.split('-')[0];if(fa!==fb)return fa.localeCompare(fb);return Number(a.seat_id.match(/S(\d+)/)[1])-Number(b.seat_id.match(/S(\d+)/)[1])});let counts={available:0,occupied:0,stale:0,offline:0};rows.forEach(s=>{counts[s.status]=(counts[s.status]||0)+1});
$('stats').innerHTML='';
Object.entries(counts).forEach(([k,v])=>{let c=document.createElement('div');c.className='seat';let h=document.createElement('b');h.textContent=k.toUpperCase();let n=document.createElement('h2');n.textContent=v;c.append(h,n);$('stats').append(c)});
['F1','F2','F3'].forEach(f=>{let el=$('floorMap'+f);el.innerHTML='';q.data.filter(s=>s.seat_id.startsWith(f+'-')).sort((a,b)=>Number(a.seat_id.match(/S(\d+)/)[1])-Number(b.seat_id.match(/S(\d+)/)[1])).forEach(s=>{let m=document.createElement('button');m.className='mapseat '+s.status;m.textContent=s.seat_id.match(/S(\d+)/)[1];m.title=s.seat_id+' · '+s.status;m.onclick=()=>{selectedMapSeat=s;$('mapInfo').textContent=s.seat_id+' — Status semasa: '+s.status;$('selectedSeat').value=s.seat_id;$('mapStatus').value=s.status;$('mapEdit').classList.remove('hidden');$('mapUpdate').classList.remove('hidden')};el.append(m)})});$('seats').innerHTML='';rows.forEach(s=>{let d=document.createElement('div');d.className='seat';let b=document.createElement('b');b.textContent=s.seat_id+' · '+s.status;d.append(b);let sel=document.createElement('select');['available','occupied','stale','offline'].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;o.selected=s.status===v;sel.append(o)});let btn=document.createElement('button');btn.textContent='Update';btn.onclick=async()=>{let v=sel.value;let u=await db.from('seats').update({status:v,reserved_by:v==='occupied'?(s.reserved_by||'admin'):null,updated_at:new Date().toISOString()}).eq('seat_id',s.seat_id);$('statusMsg').textContent=u.error?'Gagal: '+u.error.message:'Berjaya dikemas kini '+s.seat_id;if(!u.error)load()};d.append(sel,btn);$('seats').append(d)})}
$('mapUpdate').onclick=async()=>{if(!selectedMapSeat)return;let v=$('mapStatus').value;let u=await db.from('seats').update({status:v,reserved_by:v==='occupied'?(selectedMapSeat.reserved_by||'admin'):null,updated_at:new Date().toISOString()}).eq('seat_id',selectedMapSeat.seat_id);$('statusMsg').textContent=u.error?'Gagal: '+u.error.message:'Berjaya dikemas kini '+selectedMapSeat.seat_id;if(!u.error){selectedMapSeat=null;$('mapEdit').classList.add('hidden');$('mapUpdate').classList.add('hidden');load()}};$('refresh').onclick=load;$('floorFilter').onchange=load;$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
</script></body></html>
